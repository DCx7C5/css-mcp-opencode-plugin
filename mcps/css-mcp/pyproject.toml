[project]
name = "css-mcp"
version = "0.1.0"
description = "OpenCode ↔ Python bridge: socket server, permission module, task manager, MCP tools"
requires-python = ">=3.14"
dependencies = [
    "msgspec>=0.19",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/css_mcp"]
